# Site settings for haeuslerjulius.github.io
# Most of the content lives in _data/ (me, school, drones, now) and _posts/.
# See HOWTO.md for how to add projects, photos and log posts.

title: Julius Häusler
description: Builder from Bavaria. FPV drone pilot, electronics and 3D printing, small businesses.
author: Julius Häusler
email: haeuslerjulius@icloud.com
instagram: julius.haeusler
url: "https://haeuslerjulius.github.io"
baseurl: ""

# While true, every empty spot shows a yellow "fill in" box with a hint.
# Set to false before you share the site.
show_slots: true

# Keeps the old post addresses working.
permalink: /:year-:month-:day-:title/
timezone: Europe/Berlin
markdown: kramdown
kramdown:
  input: GFM
excerpt_separator: "\n\n"

plugins:
  - jekyll-sitemap

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
  - scope:
      path: ""
    values:
      layout: "page"
  # Old standalone pages keep their own HTML, no site layout.
  - scope:
      path: "reviews"
    values:
      layout: null
  - scope:
      path: "clients"
    values:
      layout: null

exclude:
  - HOWTO.md
  - Gemfile
  - Gemfile.lock
  - LICENSE
  - vendor
  - preview
