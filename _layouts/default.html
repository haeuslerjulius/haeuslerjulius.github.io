<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{% if page.title and page.url != "/" %}{{ page.title | strip_html }} · {% endif %}{{ site.title }}</title>
<meta name="description" content="{% if page.summary %}{{ page.summary | strip_html | xml_escape }}{% else %}{{ site.description | xml_escape }}{% endif %}">
<meta property="og:title" content="{{ page.title | default: site.title | strip_html | xml_escape }}">
<meta property="og:description" content="{{ page.summary | default: site.description | strip_html | xml_escape }}">
<meta property="og:image" content="{{ page.cover | default: '/selfie.upscaled.jpg' | absolute_url }}">
<link rel="alternate" type="application/rss+xml" title="{{ site.title }}" href="{{ '/feed.xml' | relative_url }}">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..900&family=Newsreader:ital,opsz,wght@0,6..72,400..600;1,6..72,400&family=JetBrains+Mono:wght@400;600&display=swap">
<link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
</head>
<body{% if site.show_slots %} class="show-slots"{% endif %}>
<a class="skip" href="#main">Skip to content</a>
<header class="bar">
  <div class="bar-in">
    <a class="mark" href="{{ '/' | relative_url }}">Julius Häusler</a>
    <nav aria-label="Sections">
      <a href="{{ '/#me' | relative_url }}">Me</a>
      <a href="{{ '/#school' | relative_url }}">School</a>
      <a href="{{ '/#builds' | relative_url }}">Builds</a>
      <a href="{{ '/#drones' | relative_url }}">Drones</a>
      <a href="{{ '/log/' | relative_url }}">Log</a>
    </nav>
  </div>
</header>

<main id="main">
{{ content }}
</main>

<footer class="foot">
  <div class="foot-in">
    <div class="foot-contact" id="contact">
      <p class="label">Contact</p>
      <p class="mail"><span class="copy-text">{{ site.email }}</span> <button type="button" class="copy" data-copy="{{ site.email }}">Copy</button></p>
      <p><a href="mailto:{{ site.email }}">Write an email</a> · <a href="https://instagram.com/{{ site.instagram }}">Instagram</a> · <a href="https://github.com/haeuslerjulius">GitHub</a></p>
    </div>
    <p class="foot-meta">Built and updated by hand in Stephanskirchen. Last change {{ site.time | date: "%-d %B %Y" }}.</p>
  </div>
</footer>
<script src="{{ '/assets/js/site.js' | relative_url }}" defer></script>
</body>
</html>
