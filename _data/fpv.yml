  - q: "Geht das auch draußen?"
    a: "Ja, Außenaufnahmen fliege ich nach den EU-Regeln (Kenntnisnachweis A1/A3). Was an Ihrem Standort erlaubt ist, kläre ich vor dem Termin."
  - q: "Geht das auch im Rohbau?"
    a: "Ja. Der Film oben ist in einem Haus im Bau entstanden. Für Bauträger eignet sich das gut, um Baufortschritt und Raumgefühl früh zu zeigen."
  - q: "Wem gehören die Aufnahmen?"
    a: "Sie bekommen die Nutzungsrechte für die Vermarktung des Objekts. Ich darf den Film als Referenz zeigen, wenn Sie nichts dagegen haben."

