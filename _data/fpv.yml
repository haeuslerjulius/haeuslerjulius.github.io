faq:
  - q: "Was ist ein FPV-Durchflug?"
    a: "FPV heißt First Person View: Ich steuere eine kleine Drohne mit einer Videobrille, als säße ich selbst darin. So fliegt sie in einem Zug durch Türen, Flure und Treppenhäuser. Das geht mit einer normalen Kameradrohne nicht."
  - q: "Ist das im Haus sicher?"
    a: "Ich fliege drinnen mit einer kleinen Drohne mit geschlossenem Propellerschutz. Die Route plane ich vorab, und ich fliege nur, wenn niemand im Weg ist. Für den Fall der Fälle bin ich mit einer Drohnen-Haftpflichtversicherung versichert."
  - q: "Das Haus ist bewohnt. Geht das trotzdem?"
    a: "Ja. Vorher räumen wir persönliche Dinge aus dem Bild, und wer im Haus ist, bleibt außerhalb der Flugroute. Spiegel und große Glasflächen plane ich in die Route ein. Jemand muss mir aufschließen, dabei sein müssen Sie nicht."
  - q: "Geht das auch draußen?"
    a: "Für kurze Strecken ja, zum Beispiel von außen durch die Haustür ins Haus, bei ruhigem Wetter. Ich fliege nach den EU-Regeln (EU-Kompetenznachweis A1/A3) und kläre vor dem Termin, was an Ihrem Standort erlaubt ist. Große Luftaufnahmen vom Grundstück biete ich derzeit nicht an."
  - q: "Geht das auch im Rohbau?"
    a: "Ja. Der Film oben ist in einem Haus im Bau entstanden. Für Bauträger eignet sich das gut, um Baufortschritt und Raumgefühl früh zu zeigen."
  - q: "Wie weit im Voraus muss ich buchen?"
    a: "Am besten etwa eine Woche vorher. Ich fliege nachmittags und am Wochenende."
  - q: "Ist der Preis ein Endpreis?"
    a: "Ja. Als Kleinunternehmer berechne ich keine Umsatzsteuer, der angegebene Preis ist der Endpreis. Sie bekommen eine Rechnung. Anfahrt bis 30 km um Rosenheim ist inklusive, bis 60 km kommen pauschal 30 € dazu."
  - q: "Gibt es Musik?"
    a: "Ich unterlege den Film mit Sounddesign aus eigenen Aufnahmen und frei nutzbaren Klängen, die Sie auch für Anzeigen verwenden dürfen. Oder Sie bekommen ihn ohne Ton und legen Ihre eigene Musik darunter."
  - q: "Kann mein Logo in den Film?"
    a: "Ja. Ihr Logo und Ihre Kontaktdaten kommen auf Wunsch ans Ende des Films, ohne Aufpreis."
  - q: "Was umfasst die Korrekturrunde?"
    a: "Änderungen am Schnitt: Länge, Farbe, Ton und Texte. Ein neuer Flug ist nicht enthalten, den biete ich auf Anfrage an."
  - q: "Wem gehören die Aufnahmen?"
    a: "Sie bekommen die Nutzungsrechte für die Vermarktung des Objekts. Ich darf den Film als Referenz zeigen, wenn Sie nichts dagegen haben."

