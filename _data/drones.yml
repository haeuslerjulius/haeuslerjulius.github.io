# Drone business section.

# One line on what you offer. Write it yourself.
pitch: ""

# How you got into FPV. A short story in your words.
story: "Speed has always fascinated me. The pure focus and risk management brings calm to my mind. Around the age of five I came into contact with drones. My dad had a Dji Phantom 3 Pro for his company. Shortly before my 15th birthday I watched the first and second Topgun films and I whished for a small analog fpv drone. My dad then giftet me a BetaFPV Cetus X Kit. That was my start."

offer:
  - title: Indoor FPV flythroughs
    detail: One continuous flight through a building. 16:9 for the website, 9:16 cut for social.
  - title: Event content
    detail: Tournament and event footage from the ground and the air.

